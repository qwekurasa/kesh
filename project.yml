name: CatIsland
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  CatIsland:
    type: application
    platform: iOS
    sources: [App, Shared]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qwekurasa.catisland
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Кот
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
    dependencies:
      - target: CatWidget
  CatWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qwekurasa.catisland.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Кот
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

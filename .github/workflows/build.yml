name: Build IPA
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - run: |
          set -o pipefail
          xcodebuild -project CatIsland.xcodeproj -scheme CatIsland -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -3 || { grep -E 'error:' build.log | sort -u | head -30 | sed 's/^/::error::/'; exit 1; }
      - run: |
          A=build/Build/Products/Release-iphoneos/CatIsland.app
          codesign -f -s - --entitlements adhoc.entitlements --generate-entitlement-der $A/PlugIns/CatWidget.appex
          codesign -f -s - --entitlements adhoc.entitlements --generate-entitlement-der $A
          codesign -vv --deep $A
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CatIsland.app Payload/
          zip -qr CatIsland.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CatIsland-ipa
          path: CatIsland.ipa
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan cat-island-build
          git rm -rfq --cached .
          git add -f CatIsland.ipa
          git commit -qm "IPA ${GITHUB_SHA::7}"
          git push -f origin cat-island-build

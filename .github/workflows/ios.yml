name: iOS IPA
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild -project Kesh.xcodeproj -scheme Kesh -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=build/Build/Products/Release-iphoneos/Kesh.app
          # Ad-hoc подпись: вшивает entitlements (App Group), Sideloadly переподпишет своим Apple ID
          codesign -f -s - --entitlements KeshWidget/KeshWidget.entitlements "$APP/PlugIns/KeshWidget.appex"
          codesign -f -s - --entitlements Kesh/Kesh.entitlements "$APP"
          mkdir Payload && cp -R "$APP" Payload/ && zip -qr ../Kesh.ipa Payload
      - name: Publish to site
        run: |
          git config user.name qwekurasa
          git config user.email 49284090+qwekurasa@users.noreply.github.com
          mkdir -p dl && cp Kesh.ipa dl/Kesh.ipa
          git add dl/Kesh.ipa
          git commit -m "Build Kesh.ipa ${{ github.run_number }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

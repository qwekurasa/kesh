name: iOS IPA
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned
        run: |
          xcodebuild -project ios/Kesh.xcodeproj -target Kesh -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R ios/build/Release-iphoneos/Kesh.app Payload/
          zip -qr Kesh.ipa Payload
      - name: Publish to site
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          mkdir -p dl && cp Kesh.ipa dl/Kesh.ipa
          git add dl/Kesh.ipa
          git commit -m "Build Kesh.ipa ${{ github.run_number }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

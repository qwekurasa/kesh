name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../Kesh.apk
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Kesh.apk --title "Кэш для Android" --notes "Сборка ${{ github.run_number }}. Установка: скачать Kesh.apk и открыть на телефоне."

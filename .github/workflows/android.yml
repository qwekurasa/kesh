name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../Kesh.apk
      - name: Publish to site
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          mkdir -p dl && cp Kesh.apk dl/Kesh.apk
          git add dl/Kesh.apk
          git commit -m "Build Kesh.apk ${{ github.run_number }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
